# H2 en memoria imitando sintaxis PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Desactiva la importación del .env
spring.config.import=

# JPA con H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT fijo para tests (no necesita variables de entorno)
jwt.secret=test-secret-key-for-testing-purposes-only-must-be-long-enough-1234567890
jwt.expiration=604800000

# Silenciar logs de seguridad en tests
logging.level.org.springframework.security=ERROR
logging.level.org.springframework.boot.test=WARN
